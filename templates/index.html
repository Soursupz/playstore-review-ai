<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Sentiment Chatbot</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', sans-serif;
    }

    body {
        height: 100vh;
        overflow: hidden;
        color: white;
    }

    /* 🔥 Background animasi gradient */
    body::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: linear-gradient(
            45deg,
            #ff00cc,
            #3333ff,
            #00ffee,
            #ff00cc
        );
        animation: animateBG 10s linear infinite;
        z-index: -1;
        filter: blur(100px);
    }

    @keyframes animateBG {
        0% { transform: translate(0,0); }
        50% { transform: translate(-25%, -25%); }
        100% { transform: translate(0,0); }
    }

    /* Container */
    .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
    }

    .chatbox {
        width: 400px;
        backdrop-filter: blur(20px);
        background: rgba(0,0,0,0.4);
        border-radius: 20px;
        padding: 20px;
        box-shadow: 0 0 30px rgba(0,255,255,0.5);
    }

    .title {
        text-align: center;
        font-size: 20px;
        margin-bottom: 15px;
    }

    .messages {
        height: 250px;
        overflow-y: auto;
        margin-bottom: 10px;
    }

    .input-area {
        display: flex;
    }

    input {
        flex: 1;
        padding: 10px;
        border-radius: 10px;
        border: none;
        outline: none;
    }

    button {
        margin-left: 10px;
        padding: 10px 15px;
        border: none;
        border-radius: 10px;
        background: cyan;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        background: magenta;
        color: white;
    }
</style>
</head>

<body>

<div class="container">
    <div class="chatbox">
        <div class="title">🤖 Sentiment AI</div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <input type="text" id="input" placeholder="Tulis ulasan...">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>
</div>

<script>
function sendMessage() {
    let input = document.getElementById("input");
    let messages = document.getElementById("messages");

    if (input.value.trim() === "") return;

    let userMsg = `<div>🧑 ${input.value}</div>`;
    messages.innerHTML += userMsg;

    // dummy response
    let botMsg = `<div>🤖 Sentimen: positif</div>`;
    messages.innerHTML += botMsg;

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
