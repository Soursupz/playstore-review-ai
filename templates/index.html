<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play Store AI Assistant</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:'Segoe UI', sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#6c5ce7,#5f6caf,#7f8cff,#6c5ce7);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    padding:20px;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.chat-container{
    width:100%;
    max-width:460px;
    height:92vh;
    background:rgba(255,255,255,0.9);
    backdrop-filter:blur(14px);
    border-radius:22px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 25px 60px rgba(0,0,0,0.25);
}

.header{
    padding:18px;
    background:linear-gradient(135deg,#6c5ce7,#5f6caf);
    color:white;
    text-align:center;
    font-weight:bold;
    font-size:17px;
}

.chat-box{
    flex:1;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
}

.message{
    padding:14px 18px;
    border-radius:20px;
    margin-bottom:14px;
    max-width:80%;
    font-size:14px;
    line-height:1.5;
    animation:fadeIn 0.3s ease;
}

.user{
    align-self:flex-end;
    background:linear-gradient(135deg,#6c5ce7,#7f8cff);
    color:white;
}

.ai{
    align-self:flex-start;
    background:white;
    border:1px solid #eee;
    color:#2d3436;
}

.meta{
    font-size:12px;
    margin-top:8px;
    opacity:0.7;
}

.form-box{
    padding:18px;
    border-top:1px solid #eee;
    background:white;
}

input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #ddd;
    margin-bottom:10px;
    font-size:14px;
}

input:focus{
    border-color:#6c5ce7;
    outline:none;
    box-shadow:0 0 0 2px rgba(108,92,231,0.2);
}

button{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    background:linear-gradient(135deg,#6c5ce7,#7f8cff);
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s ease;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.copy-btn{
    margin-top:8px;
    font-size:11px;
    background:#eee;
    border:none;
    padding:5px 8px;
    border-radius:6px;
    cursor:pointer;
}

.copy-btn:hover{
    background:#ddd;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>
<body>

<div class="chat-container">

    <div class="header">
        🤖 Play Store AI Assistant
    </div>

    <div class="chat-box" id="chatBox">

        {% if chat_history %}
            {% for chat in chat_history %}

                <!-- USER -->
                <div class="message user">
                    {{ chat.query }}
                </div>

                <!-- AI -->
                <div class="message ai">
                    <div id="answer-{{ loop.index }}">
                        {{ chat.answer }}
                    </div>

                    <div class="meta">
                        📊 Sentiment: {{ chat.sentiment }}
                        <br>
                        🔥 Tokens: {{ chat.token }}
                        <br>
                        📈 {{ chat.stats }}
                    </div>

                    <button class="copy-btn"
                        onclick="copyText('answer-{{ loop.index }}')">
                        Copy
                    </button>
                </div>

            {% endfor %}
        {% endif %}

        {% if error %}
            <div class="message ai">
                ⚠ {{ error }}
            </div>
        {% endif %}

    </div>

    <div class="form-box">
        <form method="POST">
            <input type="text" name="link"
                placeholder="Masukkan link Play Store..." required>

            <input type="text" name="query"
                placeholder="Tanyakan sesuatu tentang aplikasi..." required>

            <button type="submit">Tanya AI</button>
        </form>
    </div>

</div>

<script>
function copyText(id){
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text);
    alert("Jawaban disalin!");
}

const chatBox = document.getElementById("chatBox");
chatBox.scrollTop = chatBox.scrollHeight;
</script>

</body>
</html>
